<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#f3f6fc">
<meta name="description" content="16 款经典小游戏的离线合集，纯本地运行，无需联网。">
<title>小游戏合集 · Game Hub</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AE%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/hall.css">
<link rel="stylesheet" href="css/game.css">
</head>
<body>

<!-- ======================= 大厅 ======================= -->
<section id="view-hall" class="view is-active">
  <header class="hero">
    <div class="hero-orb orb-a"></div>
    <div class="hero-orb orb-b"></div>
    <div class="hero-inner">
      <div class="brand">
        <div class="brand-mark">🎮</div>
        <div class="brand-text">
          <h1>小游戏合集</h1>
          <p>16 款经典小游戏 · 纯本地运行 · 无需联网</p>
        </div>
      </div>
      <div class="hero-stats" id="hallStats"></div>
    </div>
  </header>

  <div class="toolbar">
    <nav class="tabs" id="catTabs" role="tablist"></nav>
    <div class="toolbar-right">
      <label class="search">
        <span>🔍</span>
        <input id="searchInput" type="search" placeholder="搜索游戏…" autocomplete="off">
      </label>
      <button class="icon-btn" id="soundBtn" title="音效开关" aria-label="音效开关">🔊</button>
    </div>
  </div>

  <div class="grid" id="gameGrid"></div>
  <div class="empty" id="emptyState" hidden>
    <div class="empty-ico">🕹️</div>
    <p>没有匹配的游戏</p>
  </div>

  <section class="panel">
    <div class="panel-head">
      <h2>成就墙</h2>
      <span class="panel-meta" id="achProgress"></span>
    </div>
    <div class="ach-list" id="achList"></div>
  </section>

  <section class="panel">
    <div class="panel-head">
      <h2>本地记录</h2>
      <span class="panel-meta">数据仅存于本机浏览器</span>
    </div>
    <div class="record-actions">
      <button class="btn ghost" id="exportBtn">导出存档</button>
      <button class="btn ghost" id="importBtn">导入存档</button>
      <button class="btn danger" id="resetBtn">清空全部记录</button>
      <input type="file" id="importFile" accept="application/json" hidden>
    </div>
  </section>

  <footer class="foot">
    <span>双击 <code>index.html</code> 即可游玩</span>
    <span class="dot">·</span>
    <span>键盘 / 触屏均可操作</span>
  </footer>
</section>

<!-- ======================= 游戏页 ======================= -->
<section id="view-game" class="view" hidden>
  <header class="game-bar">
    <button class="icon-btn" id="backBtn" title="返回大厅 (Esc)" aria-label="返回">←</button>
    <div class="game-title">
      <span class="game-ico" id="gameIcon">🎮</span>
      <div class="game-title-text">
        <strong id="gameName">游戏</strong>
        <small id="gameHint">操作提示</small>
      </div>
    </div>
    <div class="game-scores">
      <div class="score-box">
        <label>得分</label>
        <b id="scoreVal">0</b>
      </div>
      <div class="score-box best">
        <label>最高</label>
        <b id="bestVal">0</b>
      </div>
    </div>
    <div class="game-actions">
      <button class="icon-btn" id="pauseBtn" title="暂停 (P)" aria-label="暂停">⏸</button>
      <button class="icon-btn" id="restartBtn" title="重新开始 (R)" aria-label="重开">⟳</button>
      <button class="icon-btn" id="fullBtn" title="全屏" aria-label="全屏">⛶</button>
    </div>
  </header>

  <main id="stage" class="stage" tabindex="-1"></main>
  <div class="touch-layer" id="touchLayer"></div>
</section>

<div id="toastLayer" class="toast-layer" aria-live="polite"></div>
<div id="overlayLayer" class="overlay-layer"></div>

<!-- ======================= 核心 ======================= -->
<script src="js/core/util.js"></script>
<script src="js/core/audio.js"></script>
<script src="js/core/store.js"></script>
<script src="js/core/achievements.js"></script>
<script src="js/core/ui.js"></script>
<script src="js/core/hub.js"></script>

<!-- ======================= 经典休闲 ======================= -->
<script src="js/games/snake.js"></script>
<script src="js/games/tetris.js"></script>
<script src="js/games/g2048.js"></script>
<script src="js/games/minesweeper.js"></script>

<!-- ======================= 益智脑力 ======================= -->
<script src="js/games/memory.js"></script>
<script src="js/games/sudoku.js"></script>
<script src="js/games/sokoban.js"></script>
<script src="js/games/klotski.js"></script>

<!-- ======================= 对局竞技 ======================= -->
<script src="js/games/gomoku.js"></script>
<script src="js/games/tictactoe.js"></script>
<script src="js/games/reversi.js"></script>
<script src="js/games/guessnumber.js"></script>

<!-- ======================= 街机反应 ======================= -->
<script src="js/games/breakout.js"></script>
<script src="js/games/pinball.js"></script>
<script src="js/games/flappy.js"></script>
<script src="js/games/dodger.js"></script>

<script src="js/boot.js"></script>
</body>
</html>
